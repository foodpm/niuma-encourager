name: Deploy Site

# 手动触发（Actions 页面 → Deploy Site → Run）。
# 若要推 main 自动部署：需在仓库 Settings → Secrets 配置
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，并把下面的
# workflow_dispatch 触发换成 push: branches: [main] + paths。
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Typecheck functions
        working-directory: site
        run: |
          npm install --no-save @cloudflare/workers-types typescript
          npx tsc --noEmit

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      - name: Apply D1 schema (idempotent)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: d1 execute niuma-stats --remote --file=schema.sql
